---
Error:
  type: object
  properties:
    error:
      type: string
    error_description:
      oneOf:
        - type: string
        - type: object

Arrow:
  type: object
  properties:
    id:
      type: integer
      readOnly: true
      example: 1
    user_id:
      type: integer
      example: 1
    date:
      type: string
      format: date
      example: 2022-01-01
    action:
      type: string
      enum:
        - found
        - lost
      example: found
    location:
      type: string
      minLength: 2
      example: "3D Ecouen"
    shaft_manufacturer:
      type: string
      minLength: 2
      example: easton
      nullable: true
    shaft_model:
      type: string
      minLength: 2
      example: X7
      nullable: true
    shaft_material:
      type: string
      minLength: 2
      example: aluminium
    shaft_color:
      type: string
      minLength: 2
      example: black
      nullable: true
    shaft_length:
      type: number
      format: float
      example: 28.5
      nullable: true
    vanes_count:
      type: integer
      example: 3
    vanes_color:
      type: string
      minLength: 2
      example: red or red/green/bleu
      nullable: true
    point:
      type: string
      minLength: 2
      example: field
      nullable: true
    nock:
      type: string
      minLength: 2
      example: beiter CX green
      nullable: true
    description:
      type: string
      minLength: 2
      example: "found in the woods"
      nullable: true
  required:
    - action
    - date
    - location
    - shaft_material
    - vanes_count

User:
  type: object
  properties:
    id:
      type: integer
      readOnly: true
      example: 1
    email:
      type: string
      format: email
      example: nobody@example.com
    name:
      type: string
      example: "John Doe"
      minLength: 3
    club:
      type: string
      minLength: 2
      example: "Compagnie d'Arc de Coruscant"
    password:
      type: string
      writeOnly: true
      minLength: 10
  required:
    - email
    - name
    - club
